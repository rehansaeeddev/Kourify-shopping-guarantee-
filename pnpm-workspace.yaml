packages:
  - 'extensions/*'
shamefullyHoist: true
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  unrs-resolver: true
# Dependency overrides live here (not in package.json): pnpm 11 reads workspace
# config from this file, and the Shopify CLI's install ignores package.json
# overrides. onetime is pinned to its last CJS release so graphql-code-generator's
# restore-cursor dep gets a callable require('onetime') instead of the ESM v6.
overrides:
  p-map: ^4.0.0
  onetime: 5.1.2
  # Transitive only, and all three are build-time: lodash reaches us through
  # graphql-codegen inside @shopify/shopify_function, qs and morgan through
  # @react-router/serve, which this SPA build never runs. Patched versions are
  # published, so pinning costs nothing. Drop an entry once its parent ships
  # the fix itself.
  lodash@<4.18.1: '>=4.18.1'
  qs@<6.16.0: '>=6.16.0'
  morgan@<1.12.1: '>=1.12.1'
minimumReleaseAgeExclude:
  - nodemailer@10.0.3
