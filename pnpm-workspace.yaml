packages:
  - 'extensions/*'
shamefullyHoist: true
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
# core-js ships a non-essential postinstall (a funding notice). Explicitly skip
# it so pnpm doesn't fail the install with ERR_PNPM_IGNORED_BUILDS.
ignoredBuiltDependencies:
  - core-js
