# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# The URLs below are placeholders. `shopify app dev` overwrites them with the
# tunnel (see automatically_update_urls_on_dev at the bottom), and a deploy
# needs them pointed at the Laravel app: it is what serves /webhooks, /proxy
# and /api, and it serves the built admin SPA from the same origin — which is
# why the frontend can call /api with a relative path at all.

client_id = "05f95f63f2b874fd2f6103a4ebb7d697"
application_url = "https://example.com"
embedded = true
name = "kourify-shopping-guaranteey"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/updated"
  topics = [ "orders/updated" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/refunds/create"
  topics = [ "refunds/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

  # How an order backfill learns its export is ready. The bulk operation runs
  # on Shopify's side and reports only here, so without this subscription a
  # sync starts, is never told it finished, and sits on "running" forever.
  [[webhooks.subscriptions]]
  uri = "/webhooks/bulk_operations/finish"
  topics = [ "bulk_operations/finish" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  # Both revoke protection on an order that was paid for and then unwound.
  # Without them a refunded order keeps its coverage and stays claimable.
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/cancelled"
  topics = [ "orders/cancelled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
#
# Every scope here is reached by a GraphQL operation in the Laravel backend.
# Six were dropped in 2026-09: read_cart_transforms, read_orders,
# read_merchant_managed_fulfillment_orders and read_publications, because a
# write scope already grants its read ("A write scope includes read" --
# shopify.dev/docs/apps/build/authentication-authorization/manage-access-scopes);
# and write_metaobjects with write_metaobject_definitions, which nothing used --
# the word "metaobject" appears nowhere in the codebase. An app that asks for a
# scope it never exercises is one App Store review sends back.
#
# read_locales is read by ShopLanguages, so the languages screen can offer the
# languages the storefront already publishes instead of asking a merchant to
# type a locale code. It was added on 2026-10-05, which costs a re-consent --
# deliberately spent while the app has one install rather than later.
#
# read_themes is read by ThemeBlocks, which reads the published theme's
# settings_data.json and its product and cart templates to answer two
# questions the app had been guessing at: whether the theme can host app
# blocks at all, and which of ours are in it and switched on. Without it the
# dashboard could claim protection was live while the storefront showed
# nothing -- which it did, on our own test store, for three weeks. Added
# 2026-10-06.
#
# This is a second re-consent, not a free ride on read_locales': version 19
# shipped that one yesterday, so merchants have already been asked once. Worth
# saying plainly rather than letting the next person assume the two were
# batched -- and worth batching anything else that needs a scope into the
# deploy that carries this.
#
# read_customers is the exception: no query reads `customer` today, because
# displayName is stripped everywhere until Protected Customer Data approval
# lands. It stays because that approval request is for the Name field, and the
# queries come back the moment it is granted.
#
# Still open: whether write_orders is needed at all. The app only reads orders
# (order, orders, ordersCount) -- editing goes through write_order_edits and
# fulfilling through the fulfillment scopes. If a run with read_orders in its
# place works, that is the narrower ask and the better one for review.
scopes = "read_customers,read_locales,read_themes,write_cart_transforms,write_files,write_fulfillments,write_merchant_managed_fulfillment_orders,write_order_edits,write_orders,write_products,write_publications"

# Required by the CLI's schema, even though this app installs through Shopify
# managed installation and authenticates by token exchange. There is no OAuth
# callback anywhere — shopify/shopify-app-php does not provide one — so this is
# pointed at the app itself rather than an /api/auth the backend would 404.
# `shopify app dev` overwrites it with the tunnel on every run.
[auth]
redirect_urls = [ "https://example.com/app" ]

[app_proxy]
url = "https://example.com/proxy"
subpath = "kourify"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
